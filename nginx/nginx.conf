events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'backend: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # -----------------------------------------
    # BACKEND LOAD BALANCER
    # -----------------------------------------
    upstream backend_pool {
        least_conn;
        server backend1:8080 max_fails=3 fail_timeout=30s;
        server backend2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream backend_health {
        server backend1:8080;
        server backend2:8080;
    }

    # -----------------------------------------
    # NEW ZERO-DOWNTIME FRONTEND UPSTREAM
    # -----------------------------------------
    upstream frontend_pool {
        server frontend_v2:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        charset utf-8;
        client_max_body_size 10M;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ==============================
        # CV PDF (INLINE)
        # ==============================
        location = /cv {
            default_type application/pdf;

            add_header Content-Disposition "inline; filename=Ertugrul_Ozer_CV.pdf";
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=86400";

            alias /var/www/assets/cv.pdf;
        }

        location = /cv-en {
            default_type application/pdf;

            add_header Content-Disposition "inline; filename=Ertugrul_Ozer_CV_EN.pdf";
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=86400";

            alias /var/www/assets/cv-en.pdf;
        }

        # ------------------------------
        # BACKEND API
        # ------------------------------
        location /api/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Backend-Server;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        location /api/health {
            proxy_pass http://backend_health/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ------------------------------
        # FRONTEND (ZERO-DOWNTIME)
        # ------------------------------
        location / {
            proxy_pass http://frontend_pool;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_pool;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
