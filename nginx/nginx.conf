events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'backend: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Backend upstream pool with load balancing
    upstream backend_pool {
        # Load balancing method: least_conn (en az ba?lant?l? server'a y?nlendir)
        least_conn;
        
        # Health check i?in backend'leri tan?mla
        server backend1:8080 max_fails=3 fail_timeout=30s;
        server backend2:8080 max_fails=3 fail_timeout=30s;
        
        # Sticky sessions i?in ip_hash kullan (ayn? IP'den gelen istekler ayn? backend'e gider)
        # Not: ip_hash ve least_conn birlikte kullan?lamaz, bu y?zden ip_hash kullan?yoruz
        # Session affinity i?in daha iyi bir ??z?m
        # ip_hash;
        
        # Backup servers (opsiyonel)
        # server backend4:8080 backup;
    }

    # Health check endpoint'i i?in ?zel upstream
    upstream backend_health {
        server backend1:8080;
        server backend2:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Charset
        charset utf-8;

        # Client body size limit
        client_max_body_size 10M;

        # Health check endpoint - Nginx'in backend'leri kontrol etmesi i?in
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Backend API routes
        location /api/ {
            # Proxy settings
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Charset "utf-8";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Retry logic
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Backend health check endpoint
        location /api/health {
            proxy_pass http://backend_health/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Frontend routes
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            
            # WebSocket support (gerekirse)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files caching (frontend'den gelen statik dosyalar i?in)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
